name: CI

on:
  push:
    branches: [ main, "chore/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Run Canonical Predictor Backtest
        run: |
          mkdir -p reports
          npx tsx src/btc15m-predictor-backtest.ts > reports/btc15m-predictor-backtest-ci.txt
          cat reports/btc15m-predictor-backtest-ci.txt

      - name: Run Falcon Order-Book Backtest
        run: |
          npx tsx src/falcon-backtest.ts > reports/falcon-backtest-ci.txt
          cat reports/falcon-backtest-ci.txt

      - name: Verify CSV Date Range & Integrity
        run: |
          npx tsx scripts/csv-range.ts > reports/csv-range-ci.txt
          cat reports/csv-range-ci.txt

      - name: Upload Audited Backtest Reports
        uses: actions/upload-artifact@v4
        with:
          name: audited-ci-reports
          path: reports/*.txt
