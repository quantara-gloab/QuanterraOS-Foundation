<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#201402"/>
      <stop offset="45%" stop-color="#0E1222"/>
      <stop offset="100%" stop-color="#05070E"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC000"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="hardGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1080" fill="url(#spaceBg)"/>

  <!-- Cosmic Ambient Glow & Starfield -->
  <circle cx="540" cy="420" r="380" fill="rgba(255, 192, 0, 0.4)" opacity="0.6" filter="url(#hardGlow)"/>
  <circle cx="280" cy="220" r="2.5" fill="#FFF" opacity="0.8"/>
  <circle cx="820" cy="260" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="160" cy="620" r="2" fill="#FFF" opacity="0.6"/>
  <circle cx="910" cy="740" r="2.5" fill="#FFF" opacity="0.7"/>
  <circle cx="340" cy="850" r="2" fill="#FFF" opacity="0.75"/>
  <circle cx="760" cy="890" r="2" fill="#FFF" opacity="0.85"/>
  <circle cx="540" cy="140" r="3.5" fill="#FFC000" opacity="0.9"/>

  <!-- Orbital Chapter Rings -->
  <ellipse cx="540" cy="460" rx="420" ry="180" fill="none" stroke="#FFC000" stroke-width="1.5" stroke-dasharray="12 18" opacity="0.35" transform="rotate(-15 540 460)"/>
  <ellipse cx="540" cy="460" rx="480" ry="210" fill="none" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="6 24" opacity="0.25" transform="rotate(25 540 460)"/>

  <!-- Flight Deck Cybernetic Constellation Lines -->
  <line x1="140" y1="540" x2="380" y2="460" stroke="#FFC000" stroke-width="1" opacity="0.25"/>
  <line x1="940" y1="540" x2="700" y2="460" stroke="#FF5722" stroke-width="1" opacity="0.25"/>
  <circle cx="380" cy="460" r="4" fill="#FFC000" opacity="0.6"/>
  <circle cx="700" cy="460" r="4" fill="#FF5722" opacity="0.6"/>

  <!-- Central Flight Crew Pilot Silhouette & Helmet Halo -->
  <circle cx="540" cy="420" r="230" fill="#080C1A" stroke="url(#neonGlow)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="540" cy="420" r="215" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Flight Crew Pilot Visor & Cybernetic Collar -->
  <path d="M420 540 C420 460 480 340 540 340 C600 340 660 460 660 540 Z" fill="#03050B" stroke="#FFC000" stroke-width="2" opacity="0.95"/>
  <ellipse cx="540" cy="445" rx="80" ry="32" fill="#FF5722" opacity="0.85" filter="url(#glow)"/>
  <ellipse cx="540" cy="445" rx="72" ry="24" fill="#050811"/>

  <!-- Guardian Signature Insignia -->
  
        <!-- Lion Sovereign Insignia -->
        <polygon points="460,330 490,260 520,330 540,240 560,330 590,260 620,330" fill="#FFC000" filter="url(#glow)"/>
        <circle cx="540" cy="410" r="85" fill="#FF5722" opacity="0.85"/>
        <polygon points="495,385 585,385 540,470" fill="#FFC000"/>
        <circle cx="520" cy="390" r="7" fill="#FFF"/>
        <circle cx="560" cy="390" r="7" fill="#FFF"/>
      

  <!-- Tactical HUD Compass Arc -->
  <path d="M340 420 A200 200 0 0 1 740 420" fill="none" stroke="#FFC000" stroke-width="2" stroke-dasharray="8 12" opacity="0.5"/>
  <path d="M360 420 A180 180 0 0 0 720 420" fill="none" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Outer Viewfinder Framing & Bracket Corners -->
  <rect x="40" y="40" width="1000" height="1000" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <path d="M40 90 L40 40 L90 40" fill="none" stroke="#FFC000" stroke-width="4"/>
  <path d="M1040 90 L1040 40 L990 40" fill="none" stroke="#FFC000" stroke-width="4"/>
  <path d="M40 990 L40 1040 L90 1040" fill="none" stroke="#FF5722" stroke-width="4"/>
  <path d="M1040 990 L1040 1040 L990 1040" fill="none" stroke="#FF5722" stroke-width="4"/>

  <!-- Flight Deck Header Telemetry -->
  <text x="64" y="82" font-family="'JetBrains Mono', 'SF Pro Text', monospace" font-size="16" font-weight="700" fill="#FFC000" letter-spacing="3">QUANTERRAOS: THE 144 // Q144-127</text>
  <text x="1016" y="82" text-anchor="end" font-family="'JetBrains Mono', 'SF Pro Text', monospace" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="2">CH.16 · TITAN STRATOSPHERE</text>

  <!-- Bottom Brand Title & Guardian Spec -->
  <rect x="40" y="930" width="1000" height="110" rx="0" fill="rgba(8, 11, 22, 0.88)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="64" y="972" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Lion: Regime in Titan Stratosphere</text>
  <text x="64" y="1008" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#FFC000">LION // MACRO REGIME CONVICTION & SOVEREIGN COMMANDER</text>
  <text x="1016" y="990" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#CBFF69">ARTWORK · NFT-READY</text>
</svg>