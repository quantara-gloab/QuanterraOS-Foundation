  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#neon-cyan)" stroke-width="8" stroke-dasharray="240 760" stroke-linecap="round" filter="url(#neon-glow)"/>
  <circle cx="256" cy="240" r="125" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-dasharray="140 640" stroke-dashoffset="60" stroke-linecap="round"/>
  <polygon points="256,150 330,195 330,285 256,330 182,285 182,195" fill="rgba(13, 17, 23, 0.85)" stroke="url(#neon-cyan)" stroke-width="3.5"/>
  <circle cx="256" cy="235" r="54" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="235" r="54" fill="none" stroke="url(#neon-cyan)" stroke-width="8" stroke-linecap="round" filter="url(#neon-glow)"/>
