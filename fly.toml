# fly.toml application configuration for QuanterraOS.com
# Scope: Deploy quanterraos.com with persistent volume for SQLite

app = "quanterraos"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/quanterraos.db"
  GROWTH_DB_PATH = "/data/growth.db"
  PUBLIC_BASE_URL = "https://quanterraos.com"

# Persistent disk volume for SQLite WAL files (Rule B5 audit trail + telemetry ledger)
[mounts]
  source = "quanterra_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
